# Databricks Apps 設定ファイル。
#
# 注意: このファイルはDatabricksワークスペースに未接続の状態で作成しているため、
# `command` の起動方法やキー名は実際のデプロイ時に `databricks apps` の
# 最新ドキュメントと突き合わせて検証すること（Phase 4プロンプト参照）。
command:
  - "uvicorn"
  - "backend.main:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: "DATABRICKS_WAREHOUSE_ID"
    value: "50153ad923fecd73"
  - name: "GOLD_CATALOG"
    value: "workspace"     # 実ワークスペースで確認済み
  - name: "GOLD_SCHEMA"
    value: "gold"          # 実ワークスペースで確認済み
  - name: "SILVER_SCHEMA"
    value: "silver"        # 再照合ジョブが参照するマスターのスキーマ（実ワークスペースで確認済み）
  - name: "SALES_DROP_ALERT_THRESHOLD_PCT"
    value: "-20"
  - name: "RECONCILE_JOB_ID"
    value: ""              # Phase 3でジョブ作成後、Job IDを設定する
  - name: "ROW_FILTER_ENABLED_BY_UC"
    value: "false"         # SQL構文は動作確認済みだが、Databricks AppsでUser Authorization
                            # (on-behalf-of-user) を有効化し、current_user()がアプリ利用者
                            # 本人に解決されることを確認するまではAPI側フィルタを維持する
