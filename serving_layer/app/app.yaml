# Databricks Apps 設定ファイル
# ドキュメント: https://docs.databricks.com/en/dev-tools/databricks-apps/index.html
#
# このアプリは FastAPI (backend) が React ビルド成果物 (frontend/dist) を
# 静的配信する単一プロセス構成。Gold layer (gold.*) への読み取りは
# Databricks SQL Serverless Warehouse を使い、アプリ側 (backend/db.py) が
# databricks.sdk.WorkspaceClient で接続先(ホスト名/HTTP Path)を都度解決する。
#
# 注意: app.yaml の `resources:` ブロック + `env: valueFrom` によるリソース
# バインディングは、UI側でリソースをアプリに明示的に紐付けていないと
# 環境変数が注入されず KeyError で起動に失敗する（本プロジェクトでも実際に
# 発生した）。挙動が確実な「ID を直接 value として渡す」方式に倒している。
# ウェアハウスを変更する場合は、下の DATABRICKS_WAREHOUSE_ID の値を
# 書き換えてから再デプロイすること。
#
# 別途、Databricks UI 上で以下の権限付与が必要:
#   1. SQL Warehouses > 対象のウェアハウス > Permissions で、
#      このアプリのサービスプリンシパルに "Can use" を付与する。
#   2. Catalog Explorer > gold スキーマ > Permissions で、
#      同サービスプリンシパルに SELECT のみを付与する。

command:
  - "uvicorn"
  - "backend.main:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "$DATABRICKS_APP_PORT"

env:
  - name: "DATABRICKS_CATALOG"
    value: "workspace"
  - name: "DATABRICKS_GOLD_SCHEMA"
    value: "gold"
  - name: "DATABRICKS_WAREHOUSE_ID"
    value: "50153ad923fecd73" # SQL Warehouse ID (Serverless Starter Warehouse)。変更時はここを書き換える
