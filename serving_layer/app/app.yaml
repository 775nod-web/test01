# Databricks Apps 設定ファイル
# ドキュメント: https://docs.databricks.com/en/dev-tools/databricks-apps/index.html
#
# このアプリは FastAPI (backend) が React ビルド成果物 (frontend/dist) を
# 静的配信する単一プロセス構成。Gold layer (gold.*) への読み取りは
# Databricks SQL Serverless Warehouse を "sql_warehouse" リソースとして
# 参照し、アプリのサービスプリンシパルに gold スキーマへの SELECT 権限のみを
# Unity Catalog 側で付与しておくこと。
#
# 注意: Databricks Apps は DATABRICKS_HOST とアプリ自身のOAuth資格情報は
# 自動注入するが、SQL Warehouse のホスト名・HTTP Path は注入しない。
# resources で宣言したウェアハウスの ID を env の valueFrom で
# DATABRICKS_WAREHOUSE_ID として受け取り、アプリ側 (backend/db.py) で
# databricks.sdk.WorkspaceClient を使って接続先を都度解決する。

command:
  - "uvicorn"
  - "backend.main:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "$DATABRICKS_APP_PORT"

env:
  - name: "DATABRICKS_CATALOG"
    value: "workspace"
  - name: "DATABRICKS_GOLD_SCHEMA"
    value: "gold"
  - name: "DATABRICKS_WAREHOUSE_ID"
    valueFrom: "gold-sql-warehouse"

resources:
  - name: "gold-sql-warehouse"
    sql_warehouse:
      id: "7474648880209788" # デプロイ時に Free Edition のサーバーレスSQLウェアハウスIDに置き換える
      permission: "CAN_USE"
