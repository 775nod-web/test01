# Databricks Apps runtime configuration.
#
# Runs as a module (`-m backend.main`), not a bare script path, so that
# `from backend.config import ...`-style absolute imports inside the
# package resolve correctly (running "python backend/main.py" directly
# would NOT put the repo root on sys.path and those imports would fail).
#
# The Python backend reads DATABRICKS_APP_PORT itself and binds to 0.0.0.0
# (see backend/main.py / backend/config.py), so no shell expansion is
# needed here. Do not put secrets or workspace-specific IDs in this file.
command: ["python", "-m", "backend.main"]

# Environment variables passed to the app process. UC_CATALOG is the only
# one the backend reads directly (backend/config.py, backend/db.py);
# DATABRICKS_SERVER_HOSTNAME / DATABRICKS_HTTP_PATH and auth are supplied
# automatically by attaching a Databricks SQL warehouse resource to the
# app in the Databricks Apps UI/CLI (Phase 6 deployment steps) — do not
# hardcode a warehouse ID or host here.
env:
  - name: "UC_CATALOG"
    value: "bank_demo"
